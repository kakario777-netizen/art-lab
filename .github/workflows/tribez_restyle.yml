name: 트라이브 빌리지 걷기 그림 AI 덧칠 시험

on:
  workflow_dispatch:
    inputs:
      strengths: {description: "덧칠 세기 (쉼표로, 낮을수록 원래대로)", default: "0.4"}

permissions:
  contents: write

concurrency: {group: tribez-art, cancel-in-progress: false}

jobs:
  restyle:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
      - id: r
        uses: actions/cache/restore@v4
        with: {path: ~/hfcache, key: model-Lykon-dreamshaper-xl-v2-turbo}
      - name: 모델 없으면 직접 받기
        if: steps.r.outputs.cache-hit != 'true'
        run: |
          pip install --quiet huggingface_hub
          for i in 1 2 3 4 5; do
            HF_HOME=~/hfcache python -c "from huggingface_hub import snapshot_download as d; d('Lykon/dreamshaper-xl-v2-turbo', allow_patterns=['*.json','*.txt','unet/*.safetensors','vae/*.safetensors','text_encoder*/*.safetensors','tokenizer*/*'], max_workers=2)" && break
            sleep $((i*60))
          done
      - run: |
          pip install --quiet torch --index-url https://download.pytorch.org/whl/cpu
          pip install --quiet diffusers transformers accelerate safetensors pillow "rembg[cpu]"
      - env: {HF_HOME: /home/runner/hfcache, HF_HUB_OFFLINE: "1"}
        run: for s in $(echo "${{ inputs.strengths }}" | tr ',' ' '); do python tools/restyle_tribez.py $s; done
      - run: |
          git config user.name "art-bot"; git config user.email "art-bot@users.noreply.github.com"
          git add tribez/restyle && git commit -m "걷기 그림 AI 덧칠 시험 결과" || exit 0
          for i in 1 2 3; do git pull --rebase -q && git push && break; sleep 5; done
