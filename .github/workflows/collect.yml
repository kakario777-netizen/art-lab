name: 지난 실행 결과 모으기

on:
  workflow_dispatch:
    inputs:
      run_id: {description: "그림 생성 실행 번호(run id)", required: true}

permissions:
  contents: write
  actions: read

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: {path: dl, pattern: "img-*", merge-multiple: true, run-id: "${{ inputs.run_id }}", github-token: "${{ github.token }}"}
      - run: |
          mkdir -p out && cp dl/*.png out/
          pip install --quiet pillow && python tools/sheet.py
          git config user.name "art-bot"; git config user.email "art-bot@users.noreply.github.com"
          git add out sheet.jpg && git commit -m "그림 생성 결과 모음" && git pull --rebase origin main && git push
