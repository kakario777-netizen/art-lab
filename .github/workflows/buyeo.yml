name: 부여전기 그림 생성 (무료 SDXL Turbo, CPU)

on:
  workflow_dispatch:
    inputs:
      ids:   {description: "만들 그림 id (쉼표로, all 이면 전부)", default: "all"}
      seeds: {description: "시드 (쉼표로)", default: "1,2,3"}
      steps: {description: "단계 수", default: "8"}
      model: {description: "허깅페이스 모델", default: "Lykon/dreamshaper-xl-v2-turbo"}

permissions:
  contents: write

concurrency: {group: buyeo-art, cancel-in-progress: false}

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.m.outputs.matrix }}
      key: ${{ steps.m.outputs.key }}
    steps:
      - uses: actions/checkout@v4
      - id: m
        run: |
          python3 - <<'PY' >> $GITHUB_OUTPUT
          import json
          ids = "${{ inputs.ids }}".split(","); seeds = "${{ inputs.seeds }}".split(",")
          if ids == ["all"]:
              ids = [i["id"] for i in json.load(open("buyeo/prompts.json", encoding="utf-8"))["items"]]
          inc = []
          for i in ids:
              i = i.strip()
              if ":" in i:          # "id:seed" 이면 그 시드 하나만
                  a, b = i.split(":"); inc.append({"id": a, "seed": b})
              else:
                  inc += [{"id": i, "seed": s.strip()} for s in seeds]
          print("matrix=" + json.dumps({"include": inc}))
          print("key=buyeo-model-" + "${{ inputs.model }}".replace("/", "-"))
          PY

  model:
    needs: plan
    runs-on: ubuntu-latest
    steps:
      - id: c
        uses: actions/cache@v4
        with: {path: ~/hfcache, key: "${{ needs.plan.outputs.key }}", lookup-only: true}
      - name: 모델 한 번만 받기
        if: steps.c.outputs.cache-hit != 'true'
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          pip install --quiet huggingface_hub
          for i in 1 2 3 4 5; do
            HF_HOME=~/hfcache python -c "from huggingface_hub import snapshot_download as d; d('${{ inputs.model }}', allow_patterns=['*.json','*.txt','unet/*.safetensors','vae/*.safetensors','text_encoder*/*.safetensors','tokenizer*/*'], max_workers=2)" && break
            sleep $((i*60))
          done
          du -sh ~/hfcache
      - if: steps.c.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with: {path: ~/hfcache, key: "${{ needs.plan.outputs.key }}"}

  gen:
    needs: [plan, model]
    runs-on: ubuntu-latest
    timeout-minutes: 100
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix: ${{ fromJson(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - name: 디스크 비우기
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
      - id: rc
        uses: actions/cache/restore@v4
        with: {path: ~/hfcache, key: "${{ needs.plan.outputs.key }}"}
      - name: 캐시가 없으면 모델 직접 받기
        if: steps.rc.outputs.cache-hit != 'true'
        run: |
          pip install --quiet huggingface_hub
          for i in 1 2 3 4 5; do
            HF_HOME=~/hfcache python -c "from huggingface_hub import snapshot_download as d; d('${{ inputs.model }}', allow_patterns=['*.json','*.txt','unet/*.safetensors','vae/*.safetensors','text_encoder*/*.safetensors','tokenizer*/*'], max_workers=2)" && break
            sleep $((i*30))
          done
      - name: 설치
        run: |
          pip install --quiet torch --index-url https://download.pytorch.org/whl/cpu
          pip install --quiet diffusers transformers accelerate safetensors pillow "rembg[cpu]"
      - name: 생성 ${{ matrix.id }} / ${{ matrix.seed }}
        env: {STEPS: "${{ inputs.steps }}", MODEL: "${{ inputs.model }}", HF_HOME: /home/runner/hfcache, HF_HUB_OFFLINE: "1"}
        run: python tools/gen_buyeo.py ${{ matrix.id }} ${{ matrix.seed }}
      - uses: actions/upload-artifact@v4
        with: {name: "by-${{ matrix.id }}-${{ matrix.seed }}", path: "buyeo/out/\nbuyeo/game/"}

  collect:
    needs: gen
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: {path: dl, pattern: "by-*", merge-multiple: true}
      - name: 저장소에 올리기
        run: |
          mkdir -p buyeo/out buyeo/game && cp -r dl/out/* buyeo/out/ 2>/dev/null; cp -r dl/game/* buyeo/game/ 2>/dev/null; true
          sudo apt-get install -y -q fonts-noto-cjk >/dev/null 2>&1 || true
          pip install --quiet pillow && python tools/sheet_buyeo.py
          git config user.name "art-bot"; git config user.email "art-bot@users.noreply.github.com"
          git add buyeo && git commit -m "부여전기 그림 생성 결과" || exit 0
          for i in 1 2 3; do git pull --rebase -q && git push && break; sleep 5; done
