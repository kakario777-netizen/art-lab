name: 엠버폴 그림 생성 (무료 SDXL Turbo, CPU)

on:
  workflow_dispatch:
    inputs:
      ids:   {description: "만들 그림 id (쉼표로, all 이면 전부)", default: "all"}
      seeds: {description: "시드 (쉼표로)", default: "1,2"}
      steps: {description: "단계 수", default: "8"}
      model: {description: "허깅페이스 모델", default: "Lykon/dreamshaper-xl-v2-turbo"}

permissions:
  contents: write

concurrency: {group: ember-art, cancel-in-progress: false}

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.m.outputs.matrix }}
      key: ${{ steps.m.outputs.key }}
    steps:
      - uses: actions/checkout@v4
      - id: m
        run: |
          python3 - <<'PY' >> $GITHUB_OUTPUT
          import json
          ids = "${{ inputs.ids }}".split(",")
          if ids == ["all"]:
              ids = [i["id"] for i in json.load(open("emberfall/prompts.json", encoding="utf-8"))["items"]]; seeds = "${{ inputs.seeds }}".split(",")
          print("matrix=" + json.dumps({"include": [{"id": i.strip(), "seed": s.strip()} for i in ids for s in seeds]}))
          print("key=model-" + "${{ inputs.model }}".replace("/", "-"))
          PY

  model:
    needs: plan
    runs-on: ubuntu-latest
    steps:
      - id: c
        uses: actions/cache@v4
        with: {path: ~/hfcache, key: "${{ needs.plan.outputs.key }}", lookup-only: true}
      - name: 모델 한 번만 받기
        if: steps.c.outputs.cache-hit != 'true'
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          pip install --quiet huggingface_hub
          for i in 1 2 3 4 5; do
            HF_HOME=~/hfcache python -c "from huggingface_hub import snapshot_download as d; d('${{ inputs.model }}', allow_patterns=['*.json','*.txt','unet/*.safetensors','vae/*.safetensors','text_encoder*/*.safetensors','tokenizer*/*'], max_workers=2)" && break
            sleep $((i*60))
          done
          du -sh ~/hfcache
      - if: steps.c.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with: {path: ~/hfcache, key: "${{ needs.plan.outputs.key }}"}

  gen:
    needs: [plan, model]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix: ${{ fromJson(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - name: 디스크 비우기
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
      - uses: actions/cache/restore@v4
        with: {path: ~/hfcache, key: "${{ needs.plan.outputs.key }}", fail-on-cache-miss: true}
      - name: 설치
        run: |
          pip install --quiet torch --index-url https://download.pytorch.org/whl/cpu
          pip install --quiet diffusers transformers accelerate safetensors pillow "rembg[cpu]"
      - name: 생성 ${{ matrix.id }} / ${{ matrix.seed }}
        env: {STEPS: "${{ inputs.steps }}", MODEL: "${{ inputs.model }}", HF_HOME: /home/runner/hfcache, HF_HUB_OFFLINE: "1"}
        run: python tools/gen_ember.py ${{ matrix.id }} ${{ matrix.seed }}
      - uses: actions/upload-artifact@v4
        with: {name: "ef-${{ matrix.id }}-${{ matrix.seed }}", path: "emberfall/out/\nemberfall/game/"}

  collect:
    needs: gen
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: {path: dl, pattern: "ef-*", merge-multiple: true}
      - name: 저장소에 올리기
        run: |
          mkdir -p emberfall/out emberfall/game && cp -r dl/out/* emberfall/out/ 2>/dev/null; cp -r dl/game/* emberfall/game/ 2>/dev/null; cp dl/*.png emberfall/out/ 2>/dev/null; true
          pip install --quiet pillow && python tools/sheet_ember.py
          git config user.name "art-bot"; git config user.email "art-bot@users.noreply.github.com"
          git add emberfall && git commit -m "엠버폴 그림 생성 결과" || exit 0
          for i in 1 2 3; do git pull --rebase -q && git push && break; sleep 5; done
