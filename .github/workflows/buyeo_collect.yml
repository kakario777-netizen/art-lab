name: 부여전기 지난 실행 결과 모으기

on:
  workflow_dispatch:
    inputs:
      run_id: {description: "부여전기 그림 생성 실행 번호(run id)", required: true}

permissions:
  contents: write
  actions: read

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: {path: dl, pattern: "by-*", merge-multiple: true, run-id: "${{ inputs.run_id }}", github-token: "${{ github.token }}"}
      - name: 저장소에 올리기
        run: |
          mkdir -p buyeo/out buyeo/game && cp -r dl/out/* buyeo/out/ 2>/dev/null; cp -r dl/game/* buyeo/game/ 2>/dev/null; true
          sudo apt-get install -y -q fonts-noto-cjk >/dev/null 2>&1 || true
          pip install --quiet pillow && python tools/sheet_buyeo.py
          git config user.name "art-bot"; git config user.email "art-bot@users.noreply.github.com"
          git add buyeo && git commit -m "부여전기 그림 결과 모음 (run ${{ inputs.run_id }})" || exit 0
          for i in 1 2 3; do git pull --rebase -X theirs -q && git push && break; sleep 5; done
