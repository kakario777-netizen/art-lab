name: 그림 생성 (무료 SDXL, CPU)

on:
  workflow_dispatch:
    inputs:
      ids:   {description: "만들 그림 id (쉼표로)", default: "holland,haejeok,hero_adult"}
      seeds: {description: "시드 (쉼표로, 그림마다 이만큼 뽑음)", default: "1,2"}
      steps: {description: "단계 수", default: "28"}

permissions:
  contents: write

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.m.outputs.matrix }}
    steps:
      - id: m
        run: |
          python3 - <<'PY' >> $GITHUB_OUTPUT
          import json
          ids = "${{ inputs.ids }}".split(","); seeds = "${{ inputs.seeds }}".split(",")
          print("matrix=" + json.dumps({"include": [{"id": i.strip(), "seed": s.strip()} for i in ids for s in seeds]}))
          PY

  model:
    runs-on: ubuntu-latest
    steps:
      - id: c
        uses: actions/cache@v4
        with: {path: ~/hfcache, key: model-animagine-xl-4.0, lookup-only: true}
      - name: 모델 한 번만 받기 (동시에 받으면 허깅페이스가 막음)
        if: steps.c.outputs.cache-hit != 'true'
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          pip install --quiet huggingface_hub
          for i in 1 2 3 4 5; do
            HF_HOME=~/hfcache python -c "from huggingface_hub import snapshot_download as d; d('cagliostrolab/animagine-xl-4.0', allow_patterns=['*.json','*.txt','unet/*.safetensors','vae/*.safetensors','text_encoder*/*.safetensors','tokenizer*/*'], max_workers=2)" && break
            sleep $((i*60))
          done
          du -sh ~/hfcache
      - if: steps.c.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with: {path: ~/hfcache, key: model-animagine-xl-4.0}

  gen:
    needs: [plan, model]
    runs-on: ubuntu-latest
    timeout-minutes: 300
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix: ${{ fromJson(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - name: 디스크 비우기
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL; df -h /
      - uses: actions/cache/restore@v4
        with: {path: ~/hfcache, key: model-animagine-xl-4.0, fail-on-cache-miss: true}
      - name: 설치
        run: |
          pip install --quiet torch --index-url https://download.pytorch.org/whl/cpu
          pip install --quiet diffusers transformers accelerate safetensors pillow
      - name: 생성 ${{ matrix.id }} / ${{ matrix.seed }}
        env: {STEPS: "${{ inputs.steps }}", HF_HOME: /home/runner/hfcache, HF_HUB_OFFLINE: "1"}
        run: lscpu | grep -iE "model name|flags" | cut -c1-200; python tools/gen.py ${{ matrix.id }} ${{ matrix.seed }}
      - uses: actions/upload-artifact@v4
        with: {name: "img-${{ matrix.id }}-${{ matrix.seed }}", path: out/}

  collect:
    needs: gen
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: {path: dl, pattern: "img-*", merge-multiple: true}
      - name: 저장소에 올리기
        run: |
          mkdir -p out && cp dl/*.png out/ 2>/dev/null || true
          pip install --quiet pillow && python tools/sheet.py
          git config user.name "art-bot"; git config user.email "art-bot@users.noreply.github.com"
          git add out sheet.jpg && git commit -m "그림 생성 결과" && (git pull --rebase origin main && git push) || echo "변경 없음"
