name: 그림 생성 (무료 SDXL, CPU)

on:
  workflow_dispatch:
    inputs:
      ids:   {description: "만들 그림 id (쉼표로)", default: "wedding,wedding_base,family,family_base,hero_ip"}
      seeds: {description: "시드 (prompts.json에 seeds가 없는 그림만 사용)", default: "1"}
      steps: {description: "단계 수", default: "28"}

permissions:
  contents: write

env:
  MODEL_KEY: model-v2-animagine4-ipadapter

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.m.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - id: m
        run: |
          python3 - <<'PY' >> $GITHUB_OUTPUT
          import json
          cfg = {i["id"]: i for i in json.load(open("prompts.json", encoding="utf-8"))["items"]}
          ids = [x.strip() for x in "${{ inputs.ids }}".split(",")]
          dflt = [x.strip() for x in "${{ inputs.seeds }}".split(",")]
          inc = [{"id": i, "seed": str(s)} for i in ids for s in cfg[i].get("seeds", dflt)]
          print("matrix=" + json.dumps({"include": inc}))
          PY

  model:
    runs-on: ubuntu-latest
    steps:
      - id: c
        uses: actions/cache@v4
        with: {path: ~/hfcache, key: "${{ env.MODEL_KEY }}", lookup-only: true}
      - name: 모델 한 번만 받기 (동시에 받으면 허깅페이스가 막음)
        if: steps.c.outputs.cache-hit != 'true'
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          pip install --quiet huggingface_hub
          for i in 1 2 3 4 5; do
            HF_HOME=~/hfcache python -c "
          from huggingface_hub import snapshot_download as d
          d('cagliostrolab/animagine-xl-4.0', allow_patterns=['*.json','*.txt','unet/*.safetensors','vae/*.safetensors','text_encoder*/*.safetensors','tokenizer*/*'], max_workers=2)
          d('h94/IP-Adapter', allow_patterns=['sdxl_models/ip-adapter-plus_sdxl_vit-h.safetensors','models/image_encoder/*'], max_workers=2)
          " && break
            sleep $((i*60))
          done
          du -sh ~/hfcache/hub/*
      - if: steps.c.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with: {path: ~/hfcache, key: "${{ env.MODEL_KEY }}"}

  gen:
    needs: [plan, model]
    runs-on: ubuntu-latest
    timeout-minutes: 300
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix: ${{ fromJson(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - name: 디스크 비우기 + 스왑 (메모리 부족 방지)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo swapoff -a || true; sudo fallocate -l 12G /swapfile2 && sudo chmod 600 /swapfile2 && sudo mkswap /swapfile2 >/dev/null && sudo swapon /swapfile2
          free -g; df -h /
      - uses: actions/cache/restore@v4
        with: {path: ~/hfcache, key: "${{ env.MODEL_KEY }}", fail-on-cache-miss: true}
      - name: 설치
        run: |
          pip install --quiet torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install --quiet diffusers transformers accelerate safetensors pillow
      - name: 생성 ${{ matrix.id }} / ${{ matrix.seed }}
        env: {STEPS: "${{ inputs.steps }}", HF_HOME: /home/runner/hfcache, HF_HUB_OFFLINE: "1"}
        run: lscpu | grep -i "model name"; python tools/gen.py ${{ matrix.id }} ${{ matrix.seed }}
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: "img-${{ matrix.id }}-${{ matrix.seed }}", path: out/, if-no-files-found: ignore}

  collect:
    needs: gen
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: {path: dl, pattern: "img-*", merge-multiple: true}
      - name: 저장소에 올리기
        run: |
          mkdir -p out && cp dl/* out/ 2>/dev/null || true
          pip install --quiet pillow && python tools/sheet.py "${{ inputs.ids }}"
          git config user.name "art-bot"; git config user.email "art-bot@users.noreply.github.com"
          git add out sheet.jpg && git commit -m "그림 생성 결과" && (git pull --rebase origin main && git push) || echo "변경 없음"
